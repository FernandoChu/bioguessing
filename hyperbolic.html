<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperbolic Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<link rel="stylesheet" href="shared/style.css">
<style>
#svg{cursor:grab}
#svg.dragging{cursor:grabbing}
.disk{fill:var(--surface);stroke:var(--line)}
.node{stroke:var(--surface)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">BioGuessing · prototype 3 of 4</p>
    <h1>Hyperbolic tree</h1>
    <p class="lede">The tree is laid out on a hyperbolic plane: whatever sits near the centre is large, everything else shrinks toward the rim, and there is always room for more branches. Drag to move around. Click a node to select it and bring it to the centre.</p>
    <nav id="nav"></nav>
  </header>
  <div class="layout">
    <div class="stage">
      <svg id="svg" viewBox="0 0 1000 1000" role="img" aria-label="Hyperbolic tree of animal clades">
        <circle class="disk" cx="500" cy="500" r="470"></circle>
        <g id="edges"></g>
        <g id="lines"></g>
        <g id="nodes"></g>
        <g id="labels"></g>
        <g id="pins"></g>
      </svg>
      <div class="zoomctl">
        <button id="zreset" aria-label="Recentre on the root">⤢</button>
      </div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/ui.js"></script>
<script>
const { root, nodes } = BG;
const svg = d3.select("#svg");
const C = 500, RD = 470;

// complex numbers as [re, im]
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]];
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const cdiv = (a, b) => { const d = b[0] * b[0] + b[1] * b[1]; return [(a[0] * b[0] + a[1] * b[1]) / d, (a[1] * b[0] - a[0] * b[1]) / d]; };
const conj = a => [a[0], -a[1]];
const neg = a => [-a[0], -a[1]];
const abs2 = a => a[0] * a[0] + a[1] * a[1];
// Möbius translation of the disk that moves 0 to a
const mob = (a, w) => cdiv(cadd(w, a), cadd([1, 0], cmul(conj(a), w)));

// layout: each child sits a fixed hyperbolic distance from its parent, inside a wedge
const D = Math.tanh(1.05 / 2);
(function layout(n, pos, dir, wedge) {
  n.base = pos;
  if (!n.children) return;
  const ws = n.children.map(c => Math.sqrt(c.leaves().length)), W = d3.sum(ws);
  let acc = 0;
  n.children.forEach((c, i) => {
    const share = wedge * ws[i] / W;
    const a = dir - wedge / 2 + wedge * (acc + ws[i] / 2) / W;
    acc += ws[i];
    const g = mob(pos, [D * Math.cos(a), D * Math.sin(a)]);
    const back = mob(neg(g), pos);
    layout(c, g, Math.atan2(back[1], back[0]) + Math.PI, Math.min(2.5, Math.max(0.9, share * 1.8)));
  });
})(root, [0, 0], 0, 2 * Math.PI);
nodes.forEach(n => { n.z = n.base.slice(); });

// apply the disk motion that carries point s to point e
function moveAll(s, e) {
  const ns = neg(s);
  nodes.forEach(n => {
    let z = mob(e, mob(ns, n.z));
    const r2 = abs2(z);
    if (r2 >= 0.999999) { const f = 0.9999 / Math.sqrt(r2); z = [z[0] * f, z[1] * f]; }
    n.z = z;
  });
}

let px = 0.7, hoverN = null, selN = null, result = null, anim = null;
const u = v => v / px;
const S = z => [C + RD * z[0], C + RD * z[1]];
const scale = z => 1 - abs2(z);          // how large things look at this point
const f2 = p => p[0].toFixed(1) + "," + p[1].toFixed(1);

// hyperbolic straight line (a circle arc meeting the rim at right angles)
function geo(p, q) {
  const P1 = S(p), Q1 = S(q), line = `M${f2(P1)}L${f2(Q1)}`;
  const cross = p[0] * q[1] - p[1] * q[0];
  if (Math.abs(cross) < 1e-7) return line;
  const m = abs2(p) > abs2(q) ? p : q, r2 = abs2(m);
  if (r2 < 1e-6) return line;
  const [ax, ay] = p, [bx, by] = q, [cx, cy] = [m[0] / r2, m[1] / r2];
  const d = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
  if (Math.abs(d) < 1e-12) return line;
  const A = ax * ax + ay * ay, B = bx * bx + by * by, Cc = cx * cx + cy * cy;
  const ux = (A * (by - cy) + B * (cy - ay) + Cc * (ay - by)) / d;
  const uy = (A * (cx - bx) + B * (ax - cx) + Cc * (bx - ax)) / d;
  const rad = Math.hypot(ax - ux, ay - uy);
  if (rad > 1e3) return line;
  const cr = (ax - ux) * (by - uy) - (ay - uy) * (bx - ux);
  return `M${f2(P1)}A${(rad * RD).toFixed(1)},${(rad * RD).toFixed(1)} 0 0 ${cr > 0 ? 1 : 0} ${f2(Q1)}`;
}

function render() {
  px = BG.pxPerUnit(svg.node());
  const vis = nodes.filter(n => scale(n.z) > 0.015);
  const visEdges = vis.filter(n => n.parent);
  d3.select("#edges").selectAll("path").data(visEdges, n => n.name).join("path")
    .attr("class", "stroke-h").attr("style", n => `--h:${n.hue.toFixed(1)}`)
    .attr("d", n => geo(n.parent.z, n.z))
    .style("stroke-width", n => u(0.5 + 3 * Math.max(scale(n.z), scale(n.parent.z))) + "px");
  d3.select("#nodes").selectAll("circle").data(vis, n => n.name).join("circle")
    .attr("class", "node fill-h").attr("style", n => `--h:${n.hue.toFixed(1)};--dl:-12%`)
    .attr("cx", n => S(n.z)[0]).attr("cy", n => S(n.z)[1])
    .attr("r", n => u((n.children ? 3 : 2.5) + 7 * scale(n.z)))
    .style("stroke-width", n => u(0.5 + scale(n.z)) + "px");

  // labels: biggest (most central) first, skip overlaps
  const taken = [], lab = [];
  vis.filter(n => scale(n.z) > 0.2).sort((a, b) => scale(b.z) - scale(a.z)).forEach(n => {
    const f = scale(n.z), fsPx = 9 + 6 * f, p = S(n.z);
    const common = !n.children && f > 0.5;
    const text = n.children ? n.name.toUpperCase() : n.name;
    const wPx = text.length * fsPx * (n.children ? 0.72 : 0.6) + (common ? n.data.common.length * fsPx * 0.5 + 6 : 0);
    const x = p[0] + u(5 + 7 * f), box = [x, p[1] - u(fsPx * 0.65), x + u(wPx), p[1] + u(fsPx * 0.65)];
    if (taken.some(b => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) return;
    taken.push(box);
    lab.push({ n, x, y: p[1], fs: u(fsPx), common });
  });
  d3.select("#labels").selectAll("text").data(lab, d => d.n.name).join(enter => {
    const t = enter.append("text");
    t.append("tspan").attr("class", "n");
    t.append("tspan").attr("class", "c");
    return t;
  })
    .attr("class", d => (d.n.children ? "clabel" : "tlabel") + " halo")
    .attr("x", d => d.x).attr("y", d => d.y)
    .style("stroke-width", u(3) + "px")
    .style("letter-spacing", d => d.n.children ? d.fs * 0.06 + "px" : null)
    .each(function (d) {
      const t = d3.select(this);
      t.select(".n").style("font-size", d.fs + "px").text(d.n.name);
      t.select(".c").style("font-size", d.fs * 0.85 + "px").text(d.common ? "  " + d.n.data.common : "");
    });

  drawMarks();
}

function chainEdges(from, top) {       // nodes whose edge to their parent lies on the way up
  const out = [];
  for (let x = from; x && x !== top; x = x.parent) out.push(x);
  return out;
}

function drawMarks() {
  const lines = [], dots = [], pins = [];
  if (result) {
    const r = result;
    chainEdges(r.guess, r.anc).concat(chainEdges(r.answer, r.anc)).forEach(n => lines.push({ n, w: 3.4 }));
    dots.push({ n: r.anc, r: 9 });
    const g = S(r.guess.z), a = S(r.answer.z);
    pins.push({ x: g[0], y: g[1], kind: "guess" }, { x: a[0], y: a[1], kind: "answer" });
  } else {
    if (hoverN && hoverN !== selN) chainEdges(hoverN, null).forEach(n => n.parent && lines.push({ n, w: 2.2 }));
    if (selN) {
      chainEdges(selN, null).forEach(n => n.parent && lines.push({ n, w: 3.2 }));
      const p = S(selN.z);
      pins.push({ x: p[0], y: p[1], kind: "pick" });
    }
  }
  d3.select("#lines").selectAll("path").data(lines).join("path").attr("class", "hl-line")
    .attr("d", d => geo(d.n.parent.z, d.n.z)).style("stroke-width", d => u(d.w) + "px");
  d3.select("#lines").selectAll("circle").data(dots).join("circle").attr("class", "hl-area")
    .attr("cx", d => S(d.n.z)[0]).attr("cy", d => S(d.n.z)[1]).attr("r", d => u(d.r))
    .style("stroke-width", u(2.5) + "px");
  BG.drawPins(d3.select("#pins"), pins, u(1));
}

// pointer helpers
const toDisk = e => {
  const [x, y] = d3.pointer(e, svg.node());
  return [(x - C) / RD, (y - C) / RD];
};
function hit(e) {
  const [x, y] = d3.pointer(e, svg.node());
  let best = null, bestD = u(16);
  nodes.forEach(n => {
    if (scale(n.z) < 0.015) return;
    const p = S(n.z), d = Math.hypot(p[0] - x, p[1] - y);
    if (d < bestD) { bestD = d; best = n; }
  });
  return best;
}

// bring a node to the centre with a short glide
function centre(n) {
  if (anim) anim.stop();
  anim = d3.timer(() => {
    const c = n.z, r = Math.sqrt(abs2(c));
    if (r < 0.002) { anim.stop(); anim = null; return; }
    moveAll(c, [c[0] * 0.82, c[1] * 0.82]);
    render();
  });
}

let drag = null;
svg.on("pointerdown", e => {
  const z = toDisk(e);
  if (abs2(z) > 0.96) return;
  if (anim) { anim.stop(); anim = null; }
  drag = { s: z, moved: 0 };
  svg.node().setPointerCapture(e.pointerId);
  svg.classed("dragging", true);
});
svg.on("pointermove", e => {
  if (!drag) { BG.hover(hit(e)); return; }
  let z = toDisk(e);
  const r2 = abs2(z);
  if (r2 > 0.96) { const f = Math.sqrt(0.96 / r2); z = [z[0] * f, z[1] * f]; }
  drag.moved += Math.hypot(z[0] - drag.s[0], z[1] - drag.s[1]);
  moveAll(drag.s, z);
  drag.s = z;
  render();
});
svg.on("pointerup pointercancel", e => {
  if (!drag) return;
  const wasClick = drag.moved < 0.01;
  drag = null;
  svg.classed("dragging", false);
  if (wasClick && e.type === "pointerup") {
    const n = hit(e);
    BG.click(n);
    if (n) centre(n);
  }
});
svg.on("pointerleave", () => { if (!drag) BG.hover(null); });
document.getElementById("zreset").onclick = () => centre(root);

BG.nav("hyperbolic.html");
BG.init({
  highlight(n) { hoverN = n; drawMarks(); },
  select(n) { selN = n; drawMarks(); },
  focus: centre,
  reveal(res) { result = res; drawMarks(); if (res) centre(res.anc); },
  reset() { centre(root); },
}, {
  about: `<ol class="legend">
    <li><b>The centre is magnified.</b> Space grows so fast toward the rim that the whole tree always fits, however deep it goes.</li>
    <li><b>Lines are hyperbolic straight lines,</b> which is why they curve. Every branch has the same true length.</li>
    <li><b>No stable map.</b> Moving the focus reshapes the picture, so players cannot learn fixed positions. Branch lengths do not show time either.</li>
  </ol>`,
});
new ResizeObserver(() => render()).observe(svg.node());
render();
</script>
</body>
</html>
