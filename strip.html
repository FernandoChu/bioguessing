<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Strip Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<link rel="stylesheet" href="shared/style.css">
<style>
.stripbox{position:relative;width:100%;min-width:0;height:min(78vh,860px);min-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.axis{position:sticky;top:0;z-index:1;background:var(--surface);border-bottom:1px solid var(--line)}
.axis svg,#svg{display:block}
#svg{cursor:crosshair;user-select:none;-webkit-user-select:none}
.rowtint{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">BioGuessing · prototype 4 of 4</p>
    <h1>Time strip</h1>
    <p class="lede">An ordinary tree diagram, read like a long map. Time runs left to right and each group gets a row, so every clade is a block of consecutive rows. Scroll to move through it.</p>
    <nav id="nav"></nav>
  </header>
  <div class="layout">
    <div class="stripbox" id="box">
      <div class="axis"><svg id="axis" height="34" role="img" aria-label="Geological periods"></svg></div>
      <svg id="svg" role="img" aria-label="Time-calibrated tree of animals"></svg>
    </div>
    <aside id="panel"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="shared/data.js"></script>
<script src="shared/ui.js"></script>
<script>
const { root, nodes, leaves } = BG;
const box = document.getElementById("box");
const svg = d3.select("#svg"), axis = d3.select("#axis");
const ROW = 28, TOP = 10, LEFT = 14;
leaves.forEach((l, i) => { l.y = TOP + i * ROW + ROW / 2; });
root.eachAfter(n => { if (n.children) n.y = (n.children[0].y + n.children[n.children.length - 1].y) / 2; });
const H = TOP * 2 + leaves.length * ROW;

const layer = name => svg.append("g").attr("class", name);
const gEra = layer("eras"), gTint = layer("tints"), gArea = layer("areas"), gBranch = layer("branches"),
  gLine = layer("lines"), gLabel = layer("labels"), gPin = layer("pins");

let W = 700, x0 = LEFT, x1 = 500, hoverN = null, selN = null, result = null;
const x = t => x0 + (x1 - x0) * (1 - BG.tf(t));
const nodeX = n => n.children ? x(n.age) : x(0);

function render() {
  W = Math.max(320, box.clientWidth - 2);
  const labelW = Math.min(250, Math.max(140, W * 0.34));
  x1 = W - labelW;
  svg.attr("width", W).attr("height", H);
  axis.attr("width", W);

  gEra.selectAll("rect").data(BG.ERAS).join("rect").attr("class", (d, i) => i % 2 ? "band" : "band off")
    .attr("x", d => x(d[1])).attr("width", d => x(d[2]) - x(d[1])).attr("y", 0).attr("height", H);
  axis.selectAll("rect").data(BG.ERAS).join("rect").attr("class", (d, i) => i % 2 ? "band" : "band off")
    .attr("x", d => x(d[1])).attr("width", d => x(d[2]) - x(d[1])).attr("y", 0).attr("height", 34);
  axis.selectAll("text").data(BG.ERAS.concat([["today", 0, 0]])).join("text").attr("class", "eralabel")
    .attr("x", d => d[0] === "today" ? x(0) + 6 : (x(d[1]) + x(d[2])) / 2).attr("y", 17)
    .attr("text-anchor", d => d[0] === "today" ? "start" : "middle")
    .style("font-size", "11px")
    .text(d => {
      if (d[0] === "today") return "today →";
      const w = x(d[2]) - x(d[1]);
      return d[0].length * 6.4 < w - 4 ? d[0] : w > 26 ? d[0].slice(0, 3) : "";
    });

  // tinted row for each group, starting where it split from its sister
  gTint.selectAll("rect").data(leaves, n => n.name).join("rect").attr("class", "rowtint fill-h")
    .attr("style", n => `--h:${n.hue.toFixed(1)}`)
    .attr("x", n => x(n.parent.age)).attr("width", n => W - x(n.parent.age))
    .attr("y", n => n.y - ROW / 2 + 1.5).attr("height", ROW - 3).attr("rx", 3);

  // elbow branches
  const segs = [];
  nodes.forEach(n => {
    const from = n.parent ? x(n.parent.age) : x(BG.MAX_AGE);
    segs.push({ key: "h" + n.name, h: n.hue, d: `M${from},${n.y}H${nodeX(n)}` });
    if (n.children) segs.push({ key: "v" + n.name, h: n.hue, d: `M${x(n.age)},${n.children[0].y}V${n.children[n.children.length - 1].y}` });
  });
  gBranch.selectAll("path").data(segs, d => d.key).join("path").attr("class", "stroke-h")
    .attr("style", d => `--h:${d.h.toFixed(1)}`).attr("d", d => d.d).style("stroke-width", "1.8px");
  gBranch.selectAll("circle").data(nodes.filter(n => n.children), n => n.name).join("circle").attr("class", "dot-h")
    .attr("style", n => `--h:${n.hue.toFixed(1)}`).attr("cx", n => x(n.age)).attr("cy", n => n.y).attr("r", 2.8);

  // tip labels
  gLabel.selectAll("text.tlabel").data(leaves, n => n.name).join(enter => {
    const t = enter.append("text").attr("class", "tlabel");
    t.append("tspan").attr("class", "n").style("font-size", "13px");
    t.append("tspan").attr("class", "c").style("font-size", "12px");
    return t;
  }).attr("x", x(0) + 8).attr("y", n => n.y)
    .each(function (n) {
      const t = d3.select(this);
      t.select(".n").text(n.name);
      t.select(".c").text(labelW > 200 ? "  " + n.data.common : "");
    });

  // clade names sit on their stem, just left of the node, when the stem is long enough
  const cl = nodes.filter(n => n.children && n.parent &&
    x(n.age) - x(n.parent.age) >= n.name.length * 7.4 + 10);
  gLabel.selectAll("text.clabel").data(cl, n => n.name).join("text").attr("class", "clabel halo")
    .attr("x", n => x(n.age) - 5).attr("y", n => n.y - 7).attr("text-anchor", "end")
    .style("font-size", "10px").style("letter-spacing", ".06em").style("stroke-width", "3px")
    .text(n => n.name);

  drawMarks();
}

function routeUp(n, top) {
  const pts = [[nodeX(n), n.y]];
  for (let c = n; c !== top && c.parent; c = c.parent) {
    pts.push([x(c.parent.age), c.y], [x(c.parent.age), c.parent.y]);
  }
  return pts;
}
const polyD = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L");
function blockOf(n, w) {
  const ls = n.leaves();
  return { x: x(n.age), y: ls[0].y - ROW / 2 + 1, w: W - x(n.age) - 1, h: ls.length * ROW - 2, sw: w };
}

function drawMarks() {
  const areas = [], lines = [], pins = [];
  if (result) {
    const r = result;
    if (!r.same) areas.push(blockOf(r.anc, 2.5));
    const up = routeUp(r.guess, r.anc), down = routeUp(r.answer, r.anc).reverse();
    lines.push({ d: polyD(up.concat(down)), w: 3.2 });
    pins.push({ x: up[0][0], y: up[0][1], kind: "guess" });
    const end = down[down.length - 1];
    pins.push({ x: end[0], y: end[1], kind: "answer" });
  } else {
    if (hoverN && hoverN !== selN) {
      if (hoverN.children) areas.push(blockOf(hoverN, 1.2));
      lines.push({ d: polyD(routeUp(hoverN, root)), w: 2.4 });
    }
    if (selN) {
      if (selN.children) areas.push(blockOf(selN, 2));
      lines.push({ d: polyD(routeUp(selN, root)), w: 3 });
      pins.push({ x: nodeX(selN), y: selN.y, kind: "pick" });
    }
  }
  gArea.selectAll("rect").data(areas).join("rect").attr("class", "hl-area").attr("rx", 4)
    .attr("x", d => d.x).attr("y", d => d.y).attr("width", d => d.w).attr("height", d => d.h)
    .style("stroke-width", d => d.sw + "px");
  gLine.selectAll("path").data(lines).join("path").attr("class", "hl-line").attr("d", d => d.d)
    .style("stroke-width", d => d.w + "px");
  BG.drawPins(gPin, pins, 1);
}

// row picks the group, horizontal position picks how far back along its lineage
function hit(e) {
  const [px, py] = d3.pointer(e, svg.node());
  const i = Math.floor((py - TOP) / ROW);
  if (i < 0 || i >= leaves.length) return null;
  const t = px >= x(0) ? 0 : px <= x0 ? BG.MAX_AGE : BG.tfInv(1 - (px - x0) / (x1 - x0));
  return BG.lineageAt(leaves[i], t);
}
function focus(n) {
  const ls = n.leaves();
  const mid = (ls[0].y + ls[ls.length - 1].y) / 2 + 34;
  box.scrollTo({ top: Math.max(0, mid - box.clientHeight / 2), behavior: "smooth" });
}

svg.on("pointermove", e => BG.hover(hit(e)))
  .on("pointerleave", () => BG.hover(null))
  .on("click", e => BG.click(hit(e)));

BG.nav("strip.html");
BG.init({
  highlight(n) { hoverN = n; drawMarks(); },
  select(n) { selN = n; drawMarks(); },
  focus,
  reveal(res) { result = res; drawMarks(); if (res) focus(res.anc); },
  reset() { box.scrollTo({ top: 0, behavior: "smooth" }); },
}, {
  about: `<ol class="legend">
    <li><b>Left to right is time,</b> on a square-root scale, with geological periods as columns.</li>
    <li><b>Every clade is a block of rows.</b> Neighbouring rows are related at the split where their branches join.</li>
    <li><b>Picking:</b> click a row near its name for that group, or further left along its branch for an older lineage.</li>
    <li><b>Simplest to read,</b> but with thousands of species it becomes a very long scroll with no overview.</li>
  </ol>`,
});
new ResizeObserver(() => render()).observe(box);
render();
</script>
</body>
</html>
