<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioGuessing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,400;1,7..72,500&display=swap">
<link rel="stylesheet" href="shared/style.css">
<style>
#svg{cursor:crosshair}
.wedge{stroke:none}
.more{font-family:var(--sans);fill:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <h1>BioGuessing</h1>
      <p class="lede">The animal tree of life, drawn as a map: angle is lineage, distance from the centre is time. Explore it, or test yourself in a game.</p>
    </div>
    <div id="modes"></div>
  </header>
  <div class="layout">
    <div class="stage">
      <div class="viewing" id="viewing">
        <button id="up" aria-label="Go up to the parent clade">↑</button>
        <span class="vn" id="view-name"></span>
        <span class="vc" id="view-info"></span>
      </div>
      <svg id="svg" viewBox="0 0 1000 1000" role="img" aria-label="Radial time-calibrated tree of animals"></svg>
      <div id="treeview" class="treeview" hidden></div>
      <div class="zoomctl" id="zoomctl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">−</button>
        <button id="zreset" aria-label="Reset view">⤢</button>
      </div>
    </div>
    <aside id="panel"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data/tree.js"></script>
<script src="shared/settings.js"></script>
<script src="shared/data.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/views/radial.js"></script>
<script src="shared/views/tree.js"></script>
<script src="shared/games/common.js"></script>
<script src="shared/games/place.js"></script>
<script src="shared/games/trio.js"></script>
<script src="shared/games/hotcold.js"></script>
<script src="shared/games/split.js"></script>
<script src="shared/games/whichclade.js"></script>
<script src="shared/games/build.js"></script>
<script>
// Two views of the same tree; the one chosen in the settings is shown. The page shell and the games
// talk to `view`, which forwards to the active one and replays selection and marks when switching.
const $ = id => document.getElementById(id);
let current = BGSettings.get("view") === "tree" ? "tree" : "radial";
const shared = { hover: null, sel: null, result: null, marks: null };

function updateViewing(n) {
  $("view-name").textContent = n.name;
  const bits = [n.data.common, `${n.nLeaves.toLocaleString("en-US")} species on the map`, `~${BG.fmtAge(n.age)} My`].filter(Boolean);
  $("view-info").textContent = bits.join(" · ");
  $("up").disabled = n === (BG.roundClade ? BG.roundClade() : BG.root);
}
const views = {
  radial: BG.views.radial({ svg: $("svg"), onRoot: n => { if (current === "radial") updateViewing(n); } }),
  tree: BG.views.tree({ el: $("treeview"), onRoot: n => { if (current === "tree") updateViewing(n); } }),
};
const V = () => views[current];

function showView(name) {
  const from = V().root();
  V().show(false);
  current = name;
  $("svg").style.display = name === "radial" ? "" : "none";
  $("treeview").hidden = name !== "tree";
  $("zoomctl").hidden = name !== "radial";
  document.body.classList.toggle("view-tree", name === "tree");
  document.body.classList.toggle("view-radial", name === "radial");
  V().show(true);
  V().setRoot(from, false);
  V().select(shared.sel);
  V().highlight(shared.hover);
  V().marks(shared.marks);
  if (shared.result) V().reveal(shared.result);
}

const view = {
  highlight(n) { shared.hover = n; V().highlight(n); },
  select(n) { shared.sel = n; V().select(n); },
  focus(n) { V().focus(n); },
  reveal(res) { shared.result = res; V().reveal(res); },
  reset(n) { V().reset(n); },
  root: () => V().root(),
  setRoot(n, animate) { V().setRoot(n, animate); },
  marks(spec) { shared.marks = spec; V().marks(spec); },
};
$("up").onclick = () => V().goUp();
BGSettings.on(key => { if (key === "view" && BGSettings.get("view") !== current) showView(BGSettings.get("view")); });

BG.init(view, {
  about: `<ol class="legend">
    <li class="only-radial"><b>Angle is lineage.</b> Every clade is one continuous slice, so rim neighbours are related at exactly the split where their branches meet.</li>
    <li class="only-radial"><b>Radius is time.</b> The centre is the base of the clade you are viewing and the rim is today, on a square-root scale. The rings are geological periods, or epochs for young clades.</li>
    <li class="only-tree"><b>Read left to right.</b> The clade you are viewing is on the left and today is on the right; branches meet where lineages split. Wedges are groups cut off by the depth set in Settings, with their size and a few photos.</li>
    <li><b>Click</b> a species or clade to see it. <b>Double-click a clade to open it</b>; ↑ or the lineage list go back up.</li>
    <li>Switch between the <b>radial</b> and <b>tree</b> views, and set how the tree is cut, in <b>⚙ Settings</b>.</li>
    ${BG.hasExtinct ? `<li><b>† Extinct animals</b> end where they were last seen in the fossil record. They can be turned off in Settings.</li>` : ""}
  </ol>
  <p class="hint">${BG.REAL
    ? `${BG.leaves.length.toLocaleString("en-US")} species. Tree from the Open Tree of Life, dates from TimeTree (some interpolated), photos from iNaturalist. Built ${BG.meta.built}.`
    : "Demo tree of 55 groups. Run pipeline/build_tree.py to load real data."}</p>`,
});

// start in the saved view
views.radial.show(false);
views.tree.show(false);
current = current === "tree" ? "radial" : "tree";   // so showView switches into the saved one
showView(BGSettings.get("view") === "tree" ? "tree" : "radial");
</script>
</body>
</html>
